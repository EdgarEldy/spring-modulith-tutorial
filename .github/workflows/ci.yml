name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Dedicated, fast first step: ApplicationModules.verify() needs neither Docker nor a database,
      # so a module-boundary violation fails the build within seconds, before any integration test,
      # and shows up in the checks as an architecture failure rather than one failed test among many.
      - name: Verify module boundaries
        run: ./mvnw -B test -Dtest=ModularityTests

      # Full build. No "services: postgres" block: the integration tests start their own postgres:16
      # container through Testcontainers, using the Docker daemon already available on ubuntu-latest.
      - name: Build and test
        run: ./mvnw -B verify
