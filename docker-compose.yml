# Runs the packaged application next to PostgreSQL.
#   docker compose up --build      application + database
#   docker compose up db           database only, for the dev profile (application-dev.yml)
services:
  db:
    # Official image, never a custom build: the database needs no project specific layer.
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-spring_modulith_tutorial}
      POSTGRES_USER: ${DB_USER:-spring_modulith_tutorial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spring_modulith_tutorial}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Spring Boot binds these variables to spring.datasource.* through relaxed binding.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-spring_modulith_tutorial}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-spring_modulith_tutorial}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-spring_modulith_tutorial}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
